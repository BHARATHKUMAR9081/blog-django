name: Build & Deploy to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: blog-django
  INSTANCE_ID: i-0810ad9ddf79bb657
  PUBLIC_IP: 13.233.80.26
  HEALTH_URL: http://13.233.80.26
  TARGET_PORT: "80"
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  SECRETS_MANAGER_ID: deptic/blog-django/secrets
  DOCKERFILE_PATH: .

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1
      AWS_REGION: ap-south-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show build diagnostics
        run: |
          set -e
          echo "=== Build diagnostics ==="
          echo "Region: $AWS_REGION"
          echo "ECR repository: $ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Instance: $INSTANCE_ID"
          echo "Health URL: $HEALTH_URL"
          echo "Secrets Manager: $SECRETS_MANAGER_ID"
          echo "Git SHA: $GITHUB_SHA"
          echo "Dockerfile:"
          cat Dockerfile || true

      - name: Verify AWS credentials are available
        run: |
          set -e
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "Missing AWS credentials (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets)"
            exit 1
          fi
          aws sts get-caller-identity

      - name: Login to Amazon ECR (AWS CLI, static credentials)
        run: |
          set -e
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build, tag, and push Docker image to ECR
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Building $FULL_IMAGE:latest from context: $DOCKERFILE_PATH"
          docker build --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" "$DOCKERFILE_PATH"
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"

      - name: Deploy to EC2 via SSM
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          REGION="$AWS_REGION"
          SECRET_ID="$SECRETS_MANAGER_ID"

          # Verify instance is running and manageable by SSM
          STATE=$(aws ec2 describe-instances --region "$REGION" --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" --output text)
          echo "Instance state: $STATE"
          if [ "$STATE" != "running" ]; then
            echo "Instance $INSTANCE_ID is not running (state: $STATE)"
            exit 1
          fi

          # Verify SSM ping status is Online
          PING=$(aws ssm describe-instance-information --region "$REGION" \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query "InstanceInformationList[0].PingStatus" --output text)
          echo "SSM ping status: $PING"
          if [ "$PING" != "Online" ]; then
            echo "Instance $INSTANCE_ID is not reachable via SSM (status: $PING)"
            exit 1
          fi

          # Write SSM command payload to a JSON file to avoid shell parsing bugs
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $FULL_IMAGE",
              "docker stop app || true",
              "docker rm app || true",
              "SECRET_JSON=$(aws secretsmanager get-secret-value --region $REGION --secret-id $SECRET_ID --query SecretString --output text)",
              "SECRET_KEY=$(echo \"$SECRET_JSON\" | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"SECRET_KEY\"])')",
              "docker run -d --restart always -p 80:80 --name app -e SECRET_KEY=\"$SECRET_KEY\" -e DJANGO_SETTINGS_MODULE=my_site.settings $FULL_IMAGE",
              "sleep 10",
              "docker ps | grep app"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy blog-django $GITHUB_SHA" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"

          # Wait for the command to complete and fail on error
          aws ssm wait command-executed --region "$REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          STATUS=$(aws ssm get-command-invocation --region "$REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
          echo "SSM command status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "Deployment command failed. Output:"
            aws ssm get-command-invocation --region "$REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --output json || true
            exit 1
          fi

      - name: Wait for container to become healthy
        run: |
          set -e
          echo "Waiting for $HEALTH_URL to return HTTP 200..."
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed (HTTP 200)."
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: $HEALTH_URL did not return HTTP 200 within timeout."
          exit 1