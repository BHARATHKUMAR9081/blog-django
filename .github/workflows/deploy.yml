name: Build, Deploy and Verify Django Blog on EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: blog-django
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  INSTANCE_ID: i-0680d151678ab1fe7
  CONTAINER_PORT: "8000"
  HOST_PORT: "80"
  PUBLIC_URL: http://13.234.94.176

jobs:
  build-deploy-verify:
    name: Build, Push and Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build diagnostics
        run: |
          set -e
          echo "=== Build diagnostics ==="
          echo "Region: $AWS_REGION"
          echo "ECR repo: $ECR_REPOSITORY"
          echo "Registry: $ECR_REGISTRY"
          echo "Instance: $INSTANCE_ID"
          echo "Container port: $CONTAINER_PORT"
          echo "Host port: $HOST_PORT"
          echo "Public URL: $PUBLIC_URL"
          echo "Dockerfile path: ."
          ls -la
          echo "--- Dockerfile ---"
          cat Dockerfile
          echo "--- requirements.txt ---"
          cat requirements.txt

      - name: Verify Django project checks
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py check
          python manage.py makemigrations --check --dry-run || true

      - name: Configure AWS CLI credentials
        run: |
          set -e
          aws --version
          aws sts get-caller-identity

      - name: Login to Amazon ECR (AWS CLI)
        run: |
          set -e
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build, tag, and push Docker image to ECR
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Building $FULL_IMAGE:latest from context: ."
          docker build --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" .
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"

      - name: Deploy to EC2 via SSM
        run: |
          set -e
          REGION="$AWS_REGION"
          INSTANCE_ID="$INSTANCE_ID"
          ECR_REGISTRY="$ECR_REGISTRY"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          CONTAINER_PORT="$CONTAINER_PORT"
          HOST_PORT="$HOST_PORT"

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p $HOST_PORT:$CONTAINER_PORT -e PORT=$CONTAINER_PORT -e SECRET_KEY=$BLOG_SECRET_KEY --name app $IMAGE_URI",
              "sleep 20",
              "docker ps --filter name=app"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --comment "Deploy blog-django image $IMAGE_URI" \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "Status" --output text)
            echo "Attempt $i: SSM status = $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$REGION" \
                --query "StandardErrorContent" --output text || true
              exit 1
            fi
            sleep 10
          done

          if [ "$STATUS" != "Success" ]; then
            echo "SSM command did not succeed: $STATUS"
            exit 1
          fi

      - name: Post-deploy container diagnostics via SSM
        run: |
          set -e
          REGION="$AWS_REGION"
          INSTANCE_ID="$INSTANCE_ID"

          cat > /tmp/ssm-verify.json << 'SSMVERIFY'
          {
            "commands": [
              "set -e",
              "docker ps --filter name=app",
              "docker logs --tail 50 app || true",
              "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$HOST_PORT/ || true"
            ]
          }
          SSMVERIFY

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-verify.json \
            --query "Command.CommandId" --output text)

          for i in $(seq 1 20); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "Status" --output text)
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ]; then break; fi
            sleep 5
          done
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$REGION" \
            --query "StandardOutputContent" --output text || true

      - name: Health check (HTTP 200 required)
        run: |
          set -e
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$PUBLIC_URL")
          echo "Health check against $PUBLIC_URL returned HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "Health check failed: expected 200, got $CODE"
            exit 1
          fi
          echo "Deployment verified: application is healthy."