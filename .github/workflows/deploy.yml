name: Build, Deploy & Verify to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: blog-django
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  INSTANCE_ID: i-076bad10b8e417ade
  HEALTH_URL: http://13.205.95.100
  TARGET_PORT: "80"

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1
      AWS_REGION: ap-south-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build context diagnostics
        run: |
          set -e
          echo "=== Build diagnostics ==="
          echo "Region: $AWS_REGION"
          echo "ECR repo: $ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Instance: $INSTANCE_ID"
          echo "Git SHA: $GITHUB_SHA"
          ls -la
          test -f Dockerfile || { echo "Dockerfile missing"; exit 1; }
          test -f requirements.txt || { echo "requirements.txt missing"; exit 1; }
          test -f manage.py || { echo "manage.py missing"; exit 1; }
          docker --version

      - name: Login to Amazon ECR (direct AWS CLI)
        run: |
          set -e
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build, tag, and push Docker image to ECR
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Building $FULL_IMAGE:latest from context: ."
          docker build --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" .
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"
          docker images "$FULL_IMAGE" --digests

      - name: Verify EC2 instance is reachable via SSM
        run: |
          set -e
          REGION="$AWS_REGION"
          STATE=$(aws ec2 describe-instances --region "$REGION" --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].State.Name" --output text)
          echo "Instance state: $STATE"
          [ "$STATE" = "running" ] || { echo "Instance not running"; exit 1; }

          PING=$(aws ssm describe-instance-information --region "$REGION" --instance-information-filter-list "key=InstanceIds,valueSet=$INSTANCE_ID" --query "InstanceInformationList[0].PingStatus" --output text)
          echo "SSM ping status: $PING"
          [ "$PING" = "Online" ] || { echo "SSM agent not online"; exit 1; }

      - name: Deploy to EC2 via SSM
        run: |
          set -e
          REGION="$AWS_REGION"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/blog-django:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app 759204735992.dkr.ecr.ap-south-1.amazonaws.com/blog-django:latest",
              "docker ps --filter name=app"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy blog-django $GITHUB_SHA" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)
          echo "SSM command id: $COMMAND_ID"

          echo "Waiting for SSM command to complete..."
          aws ssm wait command-executed \
            --region "$REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --region "$REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)
          echo "SSM command status: $STATUS"
          [ "$STATUS" = "Success" ] || { echo "SSM deployment command failed"; exit 1; }

      - name: Health check
        run: |
          set -e
          URL="$HEALTH_URL"
          echo "Probing $URL (container port $TARGET_PORT)..."
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed: $URL returned 200"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: $URL did not return HTTP 200"
          exit 1