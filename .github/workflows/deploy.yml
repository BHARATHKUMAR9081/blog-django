name: build-deploy-verify

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/blog-django
  EC2_INSTANCE_ID: i-02128be203cebf163
  PUBLIC_URL: http://43.205.75.7
  SECRETSMANAGER_ID: deptic/blog-django/secrets
  CONTAINER_PORT: "8000"
  SECURITY_GROUP_ID: sg-0cbdf45839bf94fd6
  IAM_INSTANCE_PROFILE: blog-django-instance-profile

jobs:
  build:
    name: Build, Diagnose and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.IMAGE_TAG }}
      image_uri: ${{ steps.meta.outputs.IMAGE_URI }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Repository evidence diagnostics
        run: |
          set -euo pipefail
          echo "--- Repository layout ---"
          ls -la
          echo "--- Django project evidence ---"
          test -f manage.py && echo "manage.py present"
          test -f requirements.txt && echo "requirements.txt present"
          test -f Procfile && echo "Procfile present: $(cat Procfile)"
          test -f Dockerfile && echo "Dockerfile present (multi-stage, gunicorn my_site.wsgi)"
          test -f runtime.txt && echo "runtime.txt present: $(cat runtime.txt)"
          test -d my_site && echo "my_site project package present (wsgi module: my_site.wsgi)"
          test -d blog && echo "blog app present"
          test -d blog/migrations && echo "blog migrations present: $(ls blog/migrations | tr '\n' ' ')"

      - name: Install dependencies and run build diagnostics
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import django; print('Django version:', django.get_version())"
          export BLOG_SECRET_KEY=ci-insecure-secret-key
          export DATABASE_URL=sqlite:///ci.sqlite3
          export DEBUG=False
          export ALLOWED_HOSTS=*
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput || echo "::warning::collectstatic skipped (staticfiles config not required for build)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          {
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "IMAGE_URI=$FULL_IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "Image URI: $FULL_IMAGE"

      - name: Authenticate AWS CLI and Docker login to ECR
        run: |
          set -euo pipefail
          aws --version
          aws sts get-caller-identity
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image (context ., Django app on gunicorn port 8000)
        run: |
          set -euo pipefail
          docker build -t "${ECR_REPOSITORY_URI}:${GITHUB_SHA}" -t "${ECR_REPOSITORY_URI}:latest" .
          docker image inspect "${ECR_REPOSITORY_URI}:${GITHUB_SHA}" --format 'Image ID: {{.Id}} | ExposedPorts: {{json .Config.ExposedPorts}} | Cmd: {{json .Config.Cmd}}'

      - name: Push Docker image to ECR
        run: |
          set -euo pipefail
          docker push "${ECR_REPOSITORY_URI}:${GITHUB_SHA}"
          docker push "${ECR_REPOSITORY_URI}:latest"

  deploy:
    name: Deploy to EC2 via SSM RunShellScript
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write SSM command payload to JSON file
        run: |
          set -euo pipefail
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -euo pipefail",
              "export AWS_REGION=ap-south-1",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "export IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/blog-django:${IMAGE_TAG}",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id deptic/blog-django/secrets --region ap-south-1 --query SecretString --output text)",
              "BLOG_SECRET_KEY=$(echo \"$SECRET_JSON\" | python3 -c \"import sys,json; d=json.load(sys.stdin); print(d.get('BLOG_SECRET_KEY', d.get('secret_key', d.get('SECRET_KEY',''))))\" 2>/dev/null || true)",
              "DATABASE_URL=$(echo \"$SECRET_JSON\" | python3 -c \"import sys,json; d=json.load(sys.stdin); print(d.get('DATABASE_URL', d.get('database_url', '')))\" 2>/dev/null || true)",
              "docker run -d --restart always --name app -p 80:8000 -e PORT=8000 -e DEBUG=False -e ALLOWED_HOSTS=* -e BLOG_SECRET_KEY=\"$BLOG_SECRET_KEY\" -e DATABASE_URL=\"$DATABASE_URL\" $IMAGE_URI",
              "docker ps --filter name=app --no-trunc"
            ]
          }
          SSMPARAMS
          python3 - << 'PYEOF'
          import json, os
          with open('/tmp/ssm-params.json') as f:
              payload = json.load(f)
          image_uri = os.environ['ECR_REPOSITORY_URI'] + ':' + os.environ['IMAGE_TAG']
          payload['commands'] = [c.replace('${IMAGE_TAG}', os.environ['IMAGE_TAG']) for c in payload['commands']]
          payload['commands'] = [c for c in payload['commands'] if 'IMAGE_URI=' not in c or image_uri in c]
          with open('/tmp/ssm-params.json', 'w') as f:
              json.dump(payload, f, indent=2)
          print(json.dumps(payload, indent=2))
          PYEOF
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}

      - name: Send SSM command to EC2 instance
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"
          STATUS=$(aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --details \
            --query "CommandInvocations[0].Status" --output text)
          echo "SSM command status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --details \
              --query "CommandInvocations[0].CommandPlugins[0].Output" --output text
            exit 1
          fi

  verify:
    name: Verify public deployment over HTTP 200
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check public URL until HTTP 200
        run: |
          set -euo pipefail
          echo "Polling $PUBLIC_URL for HTTP 200 (container port $CONTAINER_PORT mapped to host 80)..."
          ATTEMPTS=30
          for i in $(seq 1 $ATTEMPTS); do
            CODE=$(curl -s -o /tmp/response.html -w "%{http_code}" "$PUBLIC_URL/" || true)
            echo "Attempt $i/$ATTEMPTS -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Deployment healthy: HTTP 200 from $PUBLIC_URL"
              head -c 500 /tmp/response.html || true
              exit 0
            fi
            sleep 10
          done
          echo "::error::Public URL $PUBLIC_URL never returned HTTP 200"
          exit 1

      - name: Verify Django admin endpoint responds
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL/admin/login/" || true)
          echo "Admin endpoint HTTP code: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::warning::Admin endpoint returned HTTP $CODE (root health check already passed)"
          fi