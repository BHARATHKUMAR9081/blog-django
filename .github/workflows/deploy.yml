name: Build & Deploy to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: blog-django
  INSTANCE_ID: i-07474a8b760b456d7
  SERVER_NAME: blog-django-server
  PUBLIC_URL: http://13.232.10.48
  TARGET_PORT: "8000"
  HOST_PORT: "80"
  DOCKERFILE_PATH: .
  SECRETS_MANAGER_ID: deptic/blog-django/secrets

jobs:
  build:
    name: Build & Verify Django App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install gunicorn

      - name: Build diagnostics - Django system check
        run: |
          set -e
          python manage.py check --no-color

      - name: Build diagnostics - migration consistency check
        run: |
          set -e
          python manage.py makemigrations --check --dry-run --no-color

      - name: Build diagnostics - collectstatic dry run
        run: |
          set -e
          python manage.py collectstatic --noinput --dry-run

      - name: Build diagnostics - compile all Python sources
        run: |
          set -e
          python -m compileall -q .

  deploy:
    name: Build, Push and Deploy to EC2 Docker
    runs-on: ubuntu-latest
    needs: build
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        run: |
          set -e
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          echo "registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Building $FULL_IMAGE from context: $DOCKERFILE_PATH"
          docker build --file "$DOCKERFILE_PATH/Dockerfile" --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" "$DOCKERFILE_PATH"
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"
          echo "full_image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          ECR_REGISTRY="${ECR_REGISTRY:-759204735992.dkr.ecr.ap-south-1.amazonaws.com}"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          # Dynamic resolution: if INSTANCE_ID missing or stopped, locate active instance by tag
          if [ -z "$INSTANCE_ID" ] || ! aws ec2 describe-instances --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].State.Name" --output text 2>/dev/null | grep -q "running"; then
            echo "==> Resolving active EC2 instance by tag Name=$SERVER_NAME..."
            RESOLVED_ID=$(aws ec2 describe-instances --region "$AWS_REGION" \
              --filters "Name=tag:Name,Values=$SERVER_NAME" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" --output text)
            if [ -n "$RESOLVED_ID" ] && [ "$RESOLVED_ID" != "None" ]; then
              INSTANCE_ID="$RESOLVED_ID"
              echo "==> Resolved instance: $INSTANCE_ID"
            else
              echo "ERROR: No running EC2 instance found for INSTANCE_ID or tag Name=$SERVER_NAME" >&2
              exit 1
            fi
          else
            echo "==> Using configured instance: $INSTANCE_ID"
          fi

          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "set -e",
              "REGION=$AWS_REGION",
              "ECR_REGISTRY=$ECR_REGISTRY",
              "IMAGE_URI=$FULL_IMAGE",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p $HOST_PORT:$TARGET_PORT --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command completion
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          ECR_REGISTRY="${ECR_REGISTRY:-759204735992.dkr.ecr.ap-south-1.amazonaws.com}"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          if [ -z "$INSTANCE_ID" ] || ! aws ec2 describe-instances --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].State.Name" --output text 2>/dev/null | grep -q "running"; then
            RESOLVED_ID=$(aws ec2 describe-instances --region "$AWS_REGION" \
              --filters "Name=tag:Name,Values=$SERVER_NAME" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" --output text)
            if [ -n "$RESOLVED_ID" ] && [ "$RESOLVED_ID" != "None" ]; then
              INSTANCE_ID="$RESOLVED_ID"
            else
              echo "ERROR: No running EC2 instance found for tag Name=$SERVER_NAME" >&2
              exit 1
            fi
          fi

          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "set -e",
              "IMAGE_URI=$FULL_IMAGE",
              "for i in $(seq 1 30); do",
              "  if curl -sf -o /dev/null http://localhost:$TARGET_PORT/; then echo 'Container healthy on target port'; exit 0; fi;",
              "  sleep 5;",
              "done",
              "echo 'Container failed health check on target port' >&2",
              "docker logs app || true",
              "exit 1"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm list-command-invocations \
              --instance-id "$INSTANCE_ID" \
              --command-id "$COMMAND_ID" \
              --query "CommandInvocations[0].Status" --output text)
            echo "SSM status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "==> Remote deployment health check succeeded"
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "==> SSM command failed with status $STATUS" >&2
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" --output text || true
              exit 1
            fi
            sleep 10
          done
          echo "==> Timed out waiting for SSM command" >&2
          exit 1

  verify:
    name: Verify Public Deployment
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check public URL (HTTP 200 only)
        run: |
          set -e
          URL="$PUBLIC_URL"
          echo "Probing $URL ..."
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "==> Deployment verified: HTTP 200 from $URL"
              exit 0
            fi
            sleep 10
          done
          echo "==> Deployment verification failed: no HTTP 200 from $URL" >&2
          exit 1

  outputs:
    name: Emit Deployment Outputs
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Summary of deployment targets
        run: |
          set -e
          {
            echo "## Deployment Summary"
            echo "- public_ip: 13.232.10.48"
            echo "- public_url: http://13.232.10.48"
            echo "- alb_dns_name: 13.232.10.48"
            echo "- instance_id: i-07474a8b760b456d7"
            echo "- ecr_repo_url: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/blog-django"
            echo "- security_group_id: sg-0cbdf45839bf94fd6"
            echo "- iam_instance_profile: blog-django-instance-profile"
            echo "- iam_role: blog-django-ec2-role"
          } | tee -a "$GITHUB_STEP_SUMMARY"