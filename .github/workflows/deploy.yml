name: Build, Deploy and Verify Django Blog on EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: blog-django
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  INSTANCE_ID: i-0680d151678ab1fe7
  CONTAINER_PORT: "80"
  HOST_PORT: "80"
  PUBLIC_URL: http://13.234.94.176
  SECRETS_MANAGER_ID: deptic/blog-django/secrets

jobs:
  build-deploy-verify:
    name: Build, Push and Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build diagnostics
        run: |
          set -e
          echo "=== Build diagnostics ==="
          echo "Region: $AWS_REGION"
          echo "ECR repo: $ECR_REPOSITORY"
          echo "Registry: $ECR_REGISTRY"
          echo "Instance: $INSTANCE_ID"
          echo "Container port: $CONTAINER_PORT"
          echo "Host port: $HOST_PORT"
          echo "Public URL: $PUBLIC_URL"
          echo "Dockerfile path: ."
          ls -la
          echo "--- Dockerfile ---"
          cat Dockerfile
          echo "--- requirements.txt ---"
          cat requirements.txt

      - name: Verify Django project checks
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py check

      - name: Configure AWS CLI credentials
        run: |
          set -e
          aws --version
          aws sts get-caller-identity

      - name: Login to Amazon ECR (AWS CLI)
        run: |
          set -e
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build, tag, and push Docker image to ECR
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Building $FULL_IMAGE:latest from context: ."
          docker build --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" .
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"

      - name: Deploy to EC2 via SSM
        run: |
          set -e
          REGION="$AWS_REGION"
          INSTANCE_ID="$INSTANCE_ID"
          ECR_REGISTRY="$ECR_REGISTRY"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          HOST_PORT="$HOST_PORT"
          CONTAINER_PORT="$CONTAINER_PORT"
          SECRET_ID="$SECRETS_MANAGER_ID"

          # The EC2 instance profile (blog-django-instance-profile) resolves the
          # secret at runtime so no secret value transits the runner.
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "set -e",
              "aws ecr get-login-password --region ${REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "docker pull ${IMAGE_URI}",
              "docker stop app || true",
              "docker rm app || true",
              "SECRET_KEY=\$(aws secretsmanager get-secret-value --secret-id ${SECRET_ID} --region ${REGION} --query SecretString --output text)",
              "docker run -d --restart always --name app -p ${HOST_PORT}:${CONTAINER_PORT} -e SECRET_KEY=\$SECRET_KEY -e DJANGO_SETTINGS_MODULE=my_site.settings -e DEBUG=0 ${IMAGE_URI}",
              "sleep 15",
              "docker ps --filter name=app --format '{{.Status}}'",
              "curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:${CONTAINER_PORT}/ || exit 1"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy blog-django $GITHUB_SHA" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --region "$REGION" \
              --query "CommandInvocations[0].Status" --output text)
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm list-command-invocations --command-id "$COMMAND_ID" --region "$REGION" --details --output json || true
              exit 1
            fi
            sleep 10
          done
          if [ "$STATUS" != "Success" ]; then
            echo "SSM command did not succeed: $STATUS"
            exit 1
          fi

      - name: Verify deployment output
        run: |
          set -e
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" --output text || true

      - name: Health check public URL
        run: |
          set -e
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL" || echo "000")
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed (HTTP 200)."
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: $PUBLIC_URL did not return HTTP 200."
          exit 1