name: build-deploy-verify

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/blog-django
  EC2_INSTANCE_ID: i-02128be203cebf163
  PUBLIC_URL: http://43.205.75.7
  SECRETSMANAGER_ID: deptic/blog-django/secrets
  CONTAINER_PORT: "8000"

jobs:
  build:
    name: Build, Diagnose and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.IMAGE_TAG }}
      image_uri: ${{ steps.meta.outputs.IMAGE_URI }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Repository evidence diagnostics
        run: |
          set -euo pipefail
          echo "--- Repository layout ---"
          ls -la
          echo "--- Django project evidence ---"
          test -f manage.py && echo "manage.py present"
          test -f requirements.txt && echo "requirements.txt present"
          test -f Procfile && echo "Procfile present: $(cat Procfile)"
          test -f Dockerfile && echo "Dockerfile present (multi-stage, gunicorn my_site.wsgi)"
          test -f runtime.txt && echo "runtime.txt present: $(cat runtime.txt)"
          test -d my_site && echo "my_site project package present (wsgi module: my_site.wsgi)"
          test -d blog && echo "blog app present"
          test -d blog/migrations && echo "blog migrations present: $(ls blog/migrations | tr '\n' ' ')"

      - name: Install dependencies and run build diagnostics
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import django; print('Django version:', django.get_version())"
          export BLOG_SECRET_KEY=ci-insecure-secret-key
          export DATABASE_URL=sqlite:///ci.sqlite3
          export DEBUG=False
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput || echo "::warning::collectstatic skipped (staticfiles config not required for build)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          {
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "IMAGE_URI=$FULL_IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=$FULL_IMAGE"
          echo "LATEST_IMAGE=$ECR_REPOSITORY_URI:latest"

      - name: Authenticate AWS CLI and Docker login to ECR
        run: |
          set -euo pipefail
          aws --version
          aws sts get-caller-identity
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image (context ., Django app on gunicorn port 8000)
        run: |
          set -euo pipefail
          docker build -t "${ECR_REPOSITORY_URI}:${GITHUB_SHA}" -t "${ECR_REPOSITORY_URI}:latest" .
          docker image inspect "${ECR_REPOSITORY_URI}:${GITHUB_SHA}" --format 'Image {{.Id}} size {{.Size}}'

      - name: Smoke test container locally (health URL / on port 8000)
        run: |
          set -euo pipefail
          docker run -d --name smoke \
            -p 8000:8000 \
            -e BLOG_SECRET_KEY=ci-insecure-secret-key \
            -e DATABASE_URL=sqlite:///tmp-smoke.db \
            -e DEBUG=False \
            -e ALLOWED_HOSTS=* \
            "${ECR_REPOSITORY_URI}:${GITHUB_SHA}"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ || true)
            echo "attempt $i -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 5
          done
          docker logs smoke || true
          exit 1

      - name: Push Docker image to ECR
        run: |
          set -euo pipefail
          docker push "${ECR_REPOSITORY_URI}:${GITHUB_SHA}"
          docker push "${ECR_REPOSITORY_URI}:latest"

      - name: Stop smoke container
        if: always()
        run: |
          docker stop smoke || true
          docker rm smoke || true

  deploy:
    name: Deploy to EC2 via SSM RunShellScript
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write SSM commands payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -euo pipefail",
              "export AWS_REGION=ap-south-1",
              "ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/blog-django:${IMAGE_TAG}",
              "SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id deptic/blog-django/secrets --region ap-south-1 --query SecretString --output text)",
              "BLOG_SECRET_KEY=$(echo \"$SECRET_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"BLOG_SECRET_KEY\", d.get(\"SECRET_KEY\",\"change-me\")))')",
              "DATABASE_URL=$(echo \"$SECRET_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"DATABASE_URL\",\"sqlite:///app.db\"))')",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always --name app -p 80:8000 -e BLOG_SECRET_KEY=\"$BLOG_SECRET_KEY\" -e DATABASE_URL=\"$DATABASE_URL\" -e DEBUG=False -e ALLOWED_HOSTS=* $IMAGE_URI",
              "docker ps --filter name=app --no-trunc",
              "for i in $(seq 1 30); do CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ || true); echo \"host health attempt $i -> $CODE\"; [ \"$CODE\" = '200' ] && exit 0; sleep 5; done",
              "docker logs --tail 100 app || true",
              "exit 1"
            ]
          }
          SSMPARAMS
          python3 - << 'PYEOF'
          import json, os
          path = "/tmp/ssm-params.json"
          with open(path) as f:
              data = json.load(f)
          tag = os.environ["IMAGE_TAG"]
          data["commands"] = [c.replace("${IMAGE_TAG}", tag) for c in data["commands"]]
          with open(path, "w") as f:
              json.dump(data, f, indent=2)
          print("SSM payload rendered for image tag", tag)
          PYEOF
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}

      - name: Send SSM command to EC2 instance
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Status" --output text)
          echo "SSM command status: $STATUS"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" --output text || true
          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM deploy command failed with status $STATUS"
            exit 1
          fi

  verify:
    name: Verify public deployment
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check public URL (must return HTTP 200)
        run: |
          set -euo pipefail
          echo "Verifying $PUBLIC_URL (instance $EC2_INSTANCE_ID, image $ECR_REPOSITORY_URI)"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/" || true)
            echo "attempt $i -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Deployment verified: HTTP 200 from $PUBLIC_URL/"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Public health check never returned HTTP 200"
          exit 1

      - name: Summary
        run: |
          {
            echo "### Deployment verified :rocket:"
            echo "- Image: $ECR_REPOSITORY_URI:${{ needs.build.outputs.image_tag }}"
            echo "- Instance: $EC2_INSTANCE_ID (ap-south-1)"
            echo "- Public URL: $PUBLIC_URL (HTTP 200)"
          } >> "$GITHUB_STEP_SUMMARY"