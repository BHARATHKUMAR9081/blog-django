name: build-deploy-verify

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/blog-django
  EC2_INSTANCE_ID: i-02128be203cebf163
  PUBLIC_URL: http://43.205.75.7
  SECRETSMANAGER_ID: deptic/blog-django/secrets
  CONTAINER_PORT: "8000"
  SECURITY_GROUP_ID: sg-0cbdf45839bf94fd6
  IAM_INSTANCE_PROFILE: blog-django-instance-profile

jobs:
  build:
    name: Build, Diagnose and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.IMAGE_TAG }}
      image_uri: ${{ steps.meta.outputs.IMAGE_URI }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Repository evidence diagnostics
        run: |
          set -euo pipefail
          echo "--- Repository layout ---"
          ls -la
          echo "--- Django project evidence ---"
          test -f manage.py && echo "manage.py present"
          test -f requirements.txt && echo "requirements.txt present"
          test -f Procfile && echo "Procfile present: $(cat Procfile)"
          test -f Dockerfile && echo "Dockerfile present (multi-stage, gunicorn my_site.wsgi)"
          test -f runtime.txt && echo "runtime.txt present: $(cat runtime.txt)"
          test -d my_site && echo "my_site project package present (wsgi module: my_site.wsgi)"
          test -d blog && echo "blog app present"
          test -d blog/migrations && echo "blog migrations present: $(ls blog/migrations | tr '\n' ' ')"

      - name: Install dependencies and run build diagnostics
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import django; print('Django version:', django.get_version())"
          export BLOG_SECRET_KEY=ci-insecure-secret-key
          export DATABASE_URL=sqlite:///ci.sqlite3
          export DEBUG=False
          export ALLOWED_HOSTS=*
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput || echo "::warning::collectstatic skipped (staticfiles config not required for build)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          {
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "IMAGE_URI=$FULL_IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "Image URI: $FULL_IMAGE"

      - name: Authenticate AWS CLI and Docker login to ECR
        run: |
          set -euo pipefail
          aws --version
          aws sts get-caller-identity
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image (context ., Django app on gunicorn port 8000)
        run: |
          set -euo pipefail
          docker build -t "${ECR_REPOSITORY_URI}:${GITHUB_SHA}" -t "${ECR_REPOSITORY_URI}:latest" .

      - name: Smoke-test built image locally on port 8000
        run: |
          set -euo pipefail
          docker run -d --name smoke \
            -e BLOG_SECRET_KEY=smoke-secret \
            -e DATABASE_URL=sqlite:///tmp-smoke.db \
            -e DEBUG=False \
            -e ALLOWED_HOSTS=* \
            -p 8000:8000 \
            "${ECR_REPOSITORY_URI}:${GITHUB_SHA}"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/ || true)
            echo "attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          docker logs smoke
          [ "$CODE" = "200" ] || { echo "local smoke test failed"; exit 1; }
          docker stop smoke && docker rm smoke

      - name: Push Docker image to ECR
        run: |
          set -euo pipefail
          docker push "${ECR_REPOSITORY_URI}:${GITHUB_SHA}"
          docker push "${ECR_REPOSITORY_URI}:latest"

  deploy:
    name: Deploy to EC2 via SSM RunShellScript
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write SSM commands payload to JSON file
        run: |
          set -euo pipefail
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -euo pipefail",
              "export AWS_REGION=ap-south-1",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "export IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/blog-django:${IMAGE_TAG}",
              "SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id deptic/blog-django/secrets --region ap-south-1 --query SecretString --output text)",
              "BLOG_SECRET_KEY=$(echo \"$SECRET_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"BLOG_SECRET_KEY\", d.get(\"SECRET_KEY\", \"fallback-secret\")))')",
              "DATABASE_URL=$(echo \"$SECRET_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"DATABASE_URL\", \"sqlite:///app.db\"))')",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always --name app -p 80:8000 -e PORT=8000 -e DEBUG=False -e ALLOWED_HOSTS=* -e BLOG_SECRET_KEY=\"$BLOG_SECRET_KEY\" -e DATABASE_URL=\"$DATABASE_URL\" $IMAGE_URI",
              "docker image prune -f || true"
            ]
          }
          SSMPARAMS
          python3 - << 'PYEOF'
          import json, os
          with open('/tmp/ssm-params.json') as f:
              data = json.load(f)
          tag = os.environ['IMAGE_TAG']
          data['commands'] = [c.replace('${IMAGE_TAG}', tag) for c in data['commands']]
          with open('/tmp/ssm-params.json', 'w') as f:
              json.dump(data, f, indent=2)
          print(json.dump and 'payload written')
          PYEOF
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}

      - name: Send SSM command to EC2 instance
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text || echo "Pending")
            echo "SSM status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              InProgress|Pending|Delayed) sleep 5 ;;
              *) echo "SSM command failed with status $STATUS"; exit 1 ;;
            esac
          done

      - name: Ensure security group allows public HTTP 80
        run: |
          set -euo pipefail
          aws ec2 authorize-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp --port 80 --cidr 0.0.0.0/0 \
            --region "$AWS_REGION" || echo "rule already present"

  verify:
    name: Verify production health over HTTP 200
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - name: Health check public URL until HTTP 200
        run: |
          set -euo pipefail
          URL="$PUBLIC_URL/"
          echo "Verifying $URL"
          CODE=""
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            echo "attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          if [ "$CODE" != "200" ]; then
            echo "::error::Production health check failed: last HTTP $CODE"
            exit 1
          fi
          echo "Production deployment verified: HTTP 200 at $URL"

      - name: Verify deployment metadata from contract
        run: |
          set -euo pipefail
          echo "instance_id=i-02128be203cebf163"
          echo "ecr_repo_url=759204735992.dkr.ecr.ap-south-1.amazonaws.com/blog-django"
          echo "public_url=http://43.205.75.7"
          echo "security_group_id=sg-0cbdf45839bf94fd6"
          echo "iam_instance_profile=blog-django-instance-profile"
          BODY=$(curl -s "$PUBLIC_URL/")
          echo "$BODY" | head -c 500