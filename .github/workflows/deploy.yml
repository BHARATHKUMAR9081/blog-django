name: Build & Deploy to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: blog-django
  INSTANCE_ID: i-07474a8b760b456d7
  SERVER_NAME: blog-django-server
  PUBLIC_URL: http://13.232.10.48
  TARGET_PORT: "8000"
  DOCKERFILE_PATH: .
  SECRETS_MANAGER_ID: deptic/blog-django/secrets

jobs:
  build:
    name: Build & Verify Django App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install gunicorn

      - name: Build diagnostics - Django system check
        run: |
          set -e
          python manage.py check --no-color

      - name: Build diagnostics - migration consistency check
        run: |
          set -e
          python manage.py makemigrations --check --dry-run --no-color

      - name: Build diagnostics - collectstatic dry run
        run: |
          set -e
          python manage.py collectstatic --noinput --dry-run

      - name: Build diagnostics - compile all Python sources
        run: |
          set -e
          python -m compileall -q .

  deploy:
    name: Build, Push and Deploy to EC2 Docker
    runs-on: ubuntu-latest
    needs: build
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        run: |
          set -e
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          echo "registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Building $FULL_IMAGE from context: $DOCKERFILE_PATH"
          docker build --file "$DOCKERFILE_PATH/Dockerfile" --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" "$DOCKERFILE_PATH"
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"
          echo "full_image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          ECR_REGISTRY="${ECR_REGISTRY:-759204735992.dkr.ecr.ap-south-1.amazonaws.com}"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          # Dynamic resolution: if INSTANCE_ID missing or stopped, locate active instance by tag
          if [ -z "$INSTANCE_ID" ] || ! aws ec2 describe-instances --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].State.Name" --output text 2>/dev/null | grep -q "running"; then
            echo "==> Resolving active EC2 instance by tag Name=$SERVER_NAME..."
            RESOLVED_ID=$(aws ec2 describe-instances --region "$AWS_REGION" \
              --filters "Name=tag:Name,Values=$SERVER_NAME" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" --output text 2>/dev/null || true)
            if [ -n "$RESOLVED_ID" ] && [ "$RESOLVED_ID" != "None" ]; then
              INSTANCE_ID="$RESOLVED_ID"
              echo "==> Resolved instance: $INSTANCE_ID"
            else
              echo "ERROR: No running EC2 instance found for tag Name=$SERVER_NAME" >&2
              exit 1
            fi
          fi
          echo "==> Deploying $FULL_IMAGE to instance $INSTANCE_ID"

          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "set -e",
              "export AWS_DEFAULT_REGION=$AWS_REGION",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $FULL_IMAGE",
              "docker stop app || true",
              "docker rm app || true",
              "SECRET_STRING=\$(aws secretsmanager get-secret-value --secret-id $SECRETS_MANAGER_ID --region $AWS_REGION --query SecretString --output text)",
              "ENV_ARGS=\"\"",
              "if [ \"\$SECRET_STRING\" != \"None\" ] && [ -n \"\$SECRET_STRING\" ]; then ENV_ARGS=\$(echo \"\$SECRET_STRING\" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(\" \".join([\"-e %s=%s\" % (k,v) for k,v in d.items()]))'); fi",
              "docker run -d --restart always --name app $ENV_ARGS -p 80:$TARGET_PORT $FULL_IMAGE",
              "docker ps --filter name=app"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"

          STATUS=""
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "SSM status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              InPending|InProgress|Delayed) sleep 5 ;;
              *) echo "SSM command failed with status: $STATUS"; aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" || true; exit 1 ;;
            esac
          done
          if [ "$STATUS" != "Success" ]; then echo "SSM command timed out"; exit 1; fi
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutput" --output text

  verify:
    name: Verify Deployment Health
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check public URL (HTTP 200 required)
        run: |
          set -e
          echo "Waiting for app to become healthy at $PUBLIC_URL ..."
          CODE=""
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health-body -w "%{http_code}" "$PUBLIC_URL/" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then break; fi
            sleep 10
          done
          if [ "$CODE" != "200" ]; then
            echo "Health check failed: expected HTTP 200, got '$CODE'" >&2
            cat /tmp/health-body || true
            exit 1
          fi
          echo "Deployment verified: $PUBLIC_URL returned HTTP 200"