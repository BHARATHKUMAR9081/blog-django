name: Build & Deploy to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: blog-django
  INSTANCE_ID: i-0810ad9ddf79bb657
  PUBLIC_IP: 13.233.80.26
  HEALTH_URL: http://13.233.80.26
  TARGET_PORT: "80"
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  SECRETS_MANAGER_ID: deptic/blog-django/secrets
  DOCKERFILE_PATH: .

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1
      AWS_REGION: ap-south-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show build diagnostics
        run: |
          set -e
          echo "=== Build diagnostics ==="
          echo "Region: $AWS_REGION"
          echo "ECR repository: $ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Instance: $INSTANCE_ID"
          echo "Health URL: $HEALTH_URL"
          echo "Secrets Manager: $SECRETS_MANAGER_ID"
          echo "Git SHA: $GITHUB_SHA"
          echo "Dockerfile:"
          cat Dockerfile || true

      - name: Login to Amazon ECR (AWS CLI, static credentials)
        run: |
          set -e
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build, tag, and push Docker image to ECR
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Building $FULL_IMAGE:latest from context: $DOCKERFILE_PATH"
          docker build --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" "$DOCKERFILE_PATH"
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"

      - name: Deploy to EC2 via SSM
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          REGION="$AWS_REGION"
          SECRET_ID="$SECRETS_MANAGER_ID"

          # Verify instance is running and manageable by SSM
          STATE=$(aws ec2 describe-instances --region "$REGION" --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" --output text)
          echo "Instance state: $STATE"
          if [ "$STATE" != "running" ]; then
            echo "Instance $INSTANCE_ID is not running (state: $STATE)"
            exit 1
          fi

          # Verify SSM ping status is Online
          PING=$(aws ssm describe-instance-information --region "$REGION" \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query "InstanceInformationList[0].PingStatus" --output text)
          echo "SSM ping status: $PING"
          if [ "$PING" != "Online" ]; then
            echo "Instance $INSTANCE_ID is not reachable via SSM (status: $PING)"
            exit 1
          fi

          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "set -e",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $FULL_IMAGE",
              "docker stop app || true",
              "docker rm app || true",
              "SECRET_JSON=\$(aws secretsmanager get-secret-value --region $REGION --secret-id $SECRET_ID --query SecretString --output text)",
              "SECRET_KEY=\$(echo \"\$SECRET_JSON\" | python3 -c 'import sys,json;print(json.load(sys.stdin)[\"SECRET_KEY\"])' 2>/dev/null || echo \"\$SECRET_JSON\")",
              "docker run -d --restart always -p 80:80 --name app -e SECRET_KEY=\"\$SECRET_KEY\" $FULL_IMAGE",
              "docker ps --filter name=app"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $GITHUB_SHA" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"

          # Wait for the command to complete
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --region "$REGION" \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text)
            echo "Attempt $i: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "SSM command failed with status: $STATUS"
                aws ssm get-command-invocation --region "$REGION" \
                  --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query "{StdOut:StandardOutputContent,StdErr:StandardErrorContent}" --output text || true
                exit 1
                ;;
            esac
            sleep 10
          done

          if [ "$STATUS" != "Success" ]; then
            echo "SSM command did not succeed in time (final status: $STATUS)"
            exit 1
          fi

          echo "SSM deployment command completed successfully."

      - name: Wait for container startup
        run: |
          echo "Allowing migrations and gunicorn to start (start period 20s)..."
          sleep 30

      - name: Verify deployment health (HTTP 200 required)
        run: |
          set -e
          URL="$HEALTH_URL"
          echo "Health checking $URL"
          OK=""
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health_body.html -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              OK="yes"
              break
            fi
            sleep 10
          done
          if [ "$OK" != "yes" ]; then
            echo "Health check failed: did not receive HTTP 200 from $URL"
            echo "--- Last response body (truncated) ---"
            head -c 2000 /tmp/health_body.html || true
            exit 1
          fi
          echo "Health check passed: $URL returned HTTP 200."