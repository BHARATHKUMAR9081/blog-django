name: build-deploy-verify

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/blog-django
  EC2_INSTANCE_ID: i-02128be203cebf163
  PUBLIC_URL: http://43.205.75.7
  SECRETSMANAGER_ID: deptic/blog-django/secrets
  CONTAINER_PORT: "8000"
  SECURITY_GROUP_ID: sg-0cbdf45839bf94fd6
  IAM_INSTANCE_PROFILE: blog-django-instance-profile

jobs:
  build:
    name: Build, Diagnose and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.IMAGE_TAG }}
      image_uri: ${{ steps.meta.outputs.IMAGE_URI }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Repository evidence diagnostics
        run: |
          set -euo pipefail
          echo "--- Repository layout ---"
          ls -la
          echo "--- Django project evidence ---"
          test -f manage.py && echo "manage.py present"
          test -f requirements.txt && echo "requirements.txt present"
          test -f Procfile && echo "Procfile present: $(cat Procfile)"
          test -f Dockerfile && echo "Dockerfile present (multi-stage, gunicorn my_site.wsgi)"
          test -f runtime.txt && echo "runtime.txt present: $(cat runtime.txt)"
          test -d my_site && echo "my_site project package present (wsgi module: my_site.wsgi)"
          test -d blog && echo "blog app present"
          test -d blog/migrations && echo "blog migrations present: $(ls blog/migrations | tr '\n' ' ')"

      - name: Install dependencies and run build diagnostics
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import django; print('Django version:', django.get_version())"
          export BLOG_SECRET_KEY=ci-insecure-secret-key
          export DATABASE_URL=sqlite:///ci.sqlite3
          export DEBUG=False
          export ALLOWED_HOSTS=*
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput || echo "::warning::collectstatic skipped (staticfiles config not required for build)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          {
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "IMAGE_URI=$FULL_IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "Image URI: $FULL_IMAGE"

      - name: Authenticate AWS CLI and Docker login to ECR
        run: |
          set -euo pipefail
          aws --version
          aws sts get-caller-identity
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image (context ., Django app on gunicorn port 8000)
        run: |
          set -euo pipefail
          docker build -t "${ECR_REPOSITORY_URI}:${GITHUB_SHA}" -t "${ECR_REPOSITORY_URI}:latest" .
          docker image inspect "${ECR_REPOSITORY_URI}:${GITHUB_SHA}" --format 'Built image: {{.Id}}'

      - name: Push Docker image to ECR
        run: |
          set -euo pipefail
          docker push "${ECR_REPOSITORY_URI}:${GITHUB_SHA}"
          docker push "${ECR_REPOSITORY_URI}:latest"

  deploy:
    name: Deploy to EC2 via SSM RunShellScript
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write SSM commands payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -euo pipefail",
              "export AWS_REGION=ap-south-1",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "export IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/blog-django:${{ needs.build.outputs.image_tag }}",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "SECRET_STRING=$(aws secretsmanager get-secret-value --secret-id deptic/blog-django/secrets --region ap-south-1 --query SecretString --output text)",
              "BLOG_SECRET_KEY=$(echo \"$SECRET_STRING\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"BLOG_SECRET_KEY\", d.get(\"secret_key\", \"fallback-secret\")))' 2>/dev/null || echo fallback-secret)",
              "DATABASE_URL=$(echo \"$SECRET_STRING\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"DATABASE_URL\", d.get(\"database_url\", \"sqlite:///tmp-app.db\")))' 2>/dev/null || echo sqlite:///tmp-app.db)",
              "docker run -d --restart always --name app -p 80:8000 -e PORT=8000 -e DEBUG=False -e ALLOWED_HOSTS=* -e BLOG_SECRET_KEY=\"$BLOG_SECRET_KEY\" -e DATABASE_URL=\"$DATABASE_URL\" $IMAGE_URI",
              "docker ps --filter name=app --no-trunc"
            ]
          }
          SSMPARAMS
          echo "--- SSM payload written ---"
          cat /tmp/ssm-params.json

      - name: Send SSM command to EC2 instance
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"
          STATUS=$(aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "CommandInvocations[0].Status" --output text)
          echo "SSM command status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM command failed with status $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "StandardErrorContent" --output text || true
            exit 1
          fi

  verify:
    name: Verify Production Health (HTTP 200)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health check public URL until HTTP 200
        run: |
          set -euo pipefail
          echo "Verifying $PUBLIC_URL (container port $CONTAINER_PORT behind host port 80)"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed with HTTP 200"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Health check never returned HTTP 200"
          exit 1

      - name: Final content sanity check
        run: |
          set -euo pipefail
          curl -fsS "$PUBLIC_URL/" | head -c 500 || true
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/")
          [ "$CODE" = "200" ] || exit 1
          echo "Deployment verified at $PUBLIC_URL (instance $EC2_INSTANCE_ID, image $ECR_REPOSITORY_URI)"