name: build-deploy-verify

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/blog-django
  EC2_INSTANCE_ID: i-02128be203cebf163
  PUBLIC_URL: http://43.205.75.7
  SECRETSMANAGER_ID: deptic/blog-django/secrets
  CONTAINER_PORT: "8000"

jobs:
  build:
    name: Build, Diagnose and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.IMAGE_TAG }}
      image_uri: ${{ steps.meta.outputs.IMAGE_URI }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Repository evidence diagnostics
        run: |
          set -euo pipefail
          echo "--- Repository layout ---"
          ls -la
          echo "--- Django project evidence ---"
          test -f manage.py && echo "manage.py present"
          test -f requirements.txt && echo "requirements.txt present"
          test -f Procfile && echo "Procfile present: $(cat Procfile)"
          test -d my_site && echo "my_site project package present (wsgi module: my_site.wsgi)"
          test -d blog && echo "blog app present"

      - name: Install dependencies and run build diagnostics
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import django; print('Django version:', django.get_version())"
          export BLOG_SECRET_KEY=ci-insecure-secret-key
          export DATABASE_URL=sqlite:///ci.sqlite3
          export DEBUG=False
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput || echo "::warning::collectstatic skipped (staticfiles config not required for build)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA}"
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          {
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "IMAGE_URI=$FULL_IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=$FULL_IMAGE"
          echo "LATEST_IMAGE=$ECR_REPOSITORY_URI:latest"

      - name: Authenticate AWS CLI and Docker login to ECR
        run: |
          set -euo pipefail
          aws --version
          aws sts get-caller-identity
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image (context ., Django app on gunicorn port 8000)
        run: |
          set -euo pipefail
          docker build -t "${ECR_REPOSITORY_URI}:${GITHUB_SHA}" -t "${ECR_REPOSITORY_URI}:latest" .
          docker image inspect "${ECR_REPOSITORY_URI}:${GITHUB_SHA}" --format 'Image {{.Id}} size {{.Size}}'

      - name: Container smoke test (gunicorn my_site.wsgi on port 8000)
        run: |
          set -euo pipefail
          docker run -d --name smoke \
            -e BLOG_SECRET_KEY=ci-insecure-secret-key \
            -e DATABASE_URL=sqlite:///ci.sqlite3 \
            -p 8000:8000 \
            "${ECR_REPOSITORY_URI}:${GITHUB_SHA}"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ || true)
            echo "attempt $i -> HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          docker logs smoke
          docker rm -f smoke
          [ "$CODE" = "200" ] || { echo "container smoke test failed"; exit 1; }

      - name: Push image to ECR
        run: |
          set -euo pipefail
          docker push "${ECR_REPOSITORY_URI}:${GITHUB_SHA}"
          docker push "${ECR_REPOSITORY_URI}:latest"
          aws ecr describe-images --repository-name blog-django --region "$AWS_REGION" \
            --query "imageDetails[?contains(imageTags, '${GITHUB_SHA}')].imageTags" --output json

  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write SSM command payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "export REGION=ap-south-1",
              "export IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/blog-django:__IMAGE_TAG__",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always --name app -p 80:8000 --env-file /etc(blog-django.env) $IMAGE_URI gunicorn my_site.wsgi:application --bind 0.0.0.0:8000"
            ]
          }
          SSMPARAMS
          sed -i "s|__IMAGE_TAG__|${GITHUB_SHA}|g" /tmp/ssm-params.json
          cat /tmp/ssm-params.json

      - name: Send SSM command to EC2 instance
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text || echo "Pending")
            echo "attempt $i -> SSM status: $STATUS"
            case "$STATUS" in
              Success) echo "SSM command succeeded"; exit 0 ;;
              InProgress|Pending|Delayed) sleep 5 ;;
              *) echo "SSM command failed with status $STATUS"; aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" || true; exit 1 ;;
            esac
          done
          echo "SSM command timed out"; exit 1

  verify:
    name: Verify production health
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check public URL (must return HTTP 200)
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/body -w '%{http_code}' "$PUBLIC_URL/" || true)
            echo "attempt $i -> HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          head -c 500 /tmp/body || true
          if [ "$CODE" != "200" ]; then
            echo "Health check failed: expected 200, got $CODE"
            exit 1
          fi
          echo "Deployment verified: $PUBLIC_URL returned HTTP 200"