name: Build & Deploy to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: blog-django
  INSTANCE_ID: i-0810ad9ddf79bb657
  SERVER_NAME: blog-django-server
  PUBLIC_IP: 13.233.80.26
  HEALTH_URL: http://13.233.80.26
  TARGET_PORT: "80"
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  DOCKERFILE_PATH: .

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1
      AWS_REGION: ap-south-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show build diagnostics
        run: |
          set -e
          echo "=== Build diagnostics ==="
          echo "Region: $AWS_REGION"
          echo "ECR repository: $ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Instance: $INSTANCE_ID"
          echo "Health URL: $HEALTH_URL"
          echo "Git SHA: $GITHUB_SHA"
          echo "Dockerfile:"
          cat Dockerfile || true

      - name: Login to Amazon ECR (AWS CLI, no OIDC)
        run: |
          set -e
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build, tag, and push Docker image to ECR
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Building $FULL_IMAGE:latest from context: $DOCKERFILE_PATH"
          docker build --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" "$DOCKERFILE_PATH"
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"

      - name: Deploy to EC2 via SSM
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          REGION="$AWS_REGION"

          # Verify instance is running and manageable by SSM
          STATE=$(aws ec2 describe-instances --region "$REGION" --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" --output text)
          echo "Instance state: $STATE"
          if [ "$STATE" != "running" ]; then
            echo "Instance $INSTANCE_ID is not running (state: $STATE)"
            exit 1
          fi

          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $FULL_IMAGE",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app -e SECRET_KEY=\$SECRET_KEY -e DATABASE_URL=\$DATABASE_URL $FULL_IMAGE",
              "docker ps --filter name=app"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"

          # Wait for the command to complete
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --region "$REGION" \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text)
            echo "Attempt $i: status=$STATUS"
            if [ "$STATUS" = "Success" ]; then
              break
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --region "$REGION" \
                --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" --output text || true
              exit 1
            fi
            sleep 10
          done
          if [ "$STATUS" != "Success" ]; then
            echo "SSM command did not succeed. Final status: $STATUS"
            exit 1
          fi

          aws ssm get-command-invocation --region "$REGION" \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text

      - name: Health check (must return HTTP 200)
        run: |
          set -e
          URL="$HEALTH_URL"
          echo "Checking health at $URL"
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: did not receive HTTP 200 from $URL"
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo "Deployment succeeded."
          echo "Image: $ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "Instance: $INSTANCE_ID"
          echo "Public URL: $HEALTH_URL"