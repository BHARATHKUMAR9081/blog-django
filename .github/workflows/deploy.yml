name: Build & Deploy to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: blog-django
  INSTANCE_ID: i-076bad10b8e417ade
  SECURITY_GROUP_ID: sg-0cbdf45839bf94fd6
  TARGET_PORT: "80"
  PUBLIC_IP: 13.205.95.100
  HEALTH_URL: http://13.205.95.100

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1
      AWS_REGION: ap-south-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show build context diagnostics
        run: |
          set -e
          echo "=== Build diagnostics ==="
          echo "Region: $AWS_REGION"
          echo "ECR repo: $ECR_REPOSITORY"
          echo "Instance: $INSTANCE_ID"
          echo "Git SHA: $GITHUB_SHA"
          ls -la
          test -f Dockerfile || { echo "Dockerfile missing"; exit 1; }
          docker --version

      - name: Login to Amazon ECR (direct AWS CLI)
        run: |
          set -e
          REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build, tag, and push Docker image to ECR
        env:
          ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Building $FULL_IMAGE:latest from context: ."
          docker build --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" .
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"
          docker images "$FULL_IMAGE" --digests

      - name: Deploy to EC2 via SSM
        env:
          ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
        run: |
          set -e
          REGION="$AWS_REGION"
          ECR_REGISTRY="$ECR_REGISTRY"
          REPO="$ECR_REPOSITORY"
          FULL_IMAGE="$ECR_REGISTRY/$REPO:latest"
          INSTANCE_ID="$INSTANCE_ID"

          # Verify instance is running and reachable by SSM
          STATE=$(aws ec2 describe-instances --region "$REGION" --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].State.Name" --output text)
          echo "Instance state: $STATE"
          [ "$STATE" = "running" ] || { echo "Instance not running"; exit 1; }

          PING=$(aws ssm describe-instance-information --region "$REGION" --instance-information-filter-list "key=InstanceIds,valueSet=$INSTANCE_ID" --query "InstanceInformationList[0].PingStatus" --output text)
          echo "SSM ping status: $PING"
          [ "$PING" = "Online" ] || { echo "SSM agent not online"; exit 1; }

          # Substitute concrete values into the payload (no shell parsing issues)
          PAYLOAD_IMAGE="$FULL_IMAGE" \
          PAYLOAD_REGION="$REGION" \
          PAYLOAD_REGISTRY="$ECR_REGISTRY" \
          envsubst < /dev/null > /dev/null || true

          cat > /tmp/ssm-params.json << SSMFINAL
          {
            "commands": [
              "set -e",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $FULL_IMAGE",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $FULL_IMAGE",
              "docker ps --filter name=app"
            ]
          }
          SSMFINAL

          echo "SSM payload:"
          cat /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $FULL_IMAGE" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command completion
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "Status" --output text)
            echo "Attempt $i: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query "{StdOut:StandardOutputContent,StdErr:StandardErrorContent}" --output text
                exit 1 ;;
            esac
            sleep 10
          done
          [ "$STATUS" = "Success" ] || { echo "SSM command did not succeed: $STATUS"; exit 1; }

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query "StandardOutputContent" --output text

      - name: Verify deployment health
        run: |
          set -e
          echo "Waiting for container to start and pass health checks..."
          sleep 30
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Deployment healthy: $HEALTH_URL returned 200"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: $HEALTH_URL did not return HTTP 200"
          exit 1