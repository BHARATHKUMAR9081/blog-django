name: build-deploy-verify

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/blog-django
  EC2_INSTANCE_ID: i-02128be203cebf163
  PUBLIC_URL: http://43.205.75.7
  SECRETSMANAGER_ID: deptic/blog-django/secrets
  CONTAINER_PORT: "8000"

jobs:
  build:
    name: Build, Diagnose and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.IMAGE_TAG }}
      image_uri: ${{ steps.meta.outputs.IMAGE_URI }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Repository evidence diagnostics
        run: |
          set -euo pipefail
          echo "--- Repository layout ---"
          ls -la
          echo "--- Django project evidence ---"
          test -f manage.py && echo "manage.py present"
          test -f requirements.txt && echo "requirements.txt present"
          test -f Procfile && echo "Procfile present: $(cat Procfile)"
          test -f Dockerfile && echo "Dockerfile present (multi-stage, gunicorn my_site.wsgi)"
          test -f runtime.txt && echo "runtime.txt present: $(cat runtime.txt)"
          test -d my_site && echo "my_site project package present (wsgi module: my_site.wsgi)"
          test -d blog && echo "blog app present"
          test -d blog/migrations && echo "blog migrations present: $(ls blog/migrations | tr '\n' ' ')"

      - name: Install dependencies and run build diagnostics
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import django; print('Django version:', django.get_version())"
          export BLOG_SECRET_KEY=ci-insecure-secret-key
          export DATABASE_URL=sqlite:///ci.sqlite3
          export DEBUG=False
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput || echo "::warning::collectstatic skipped (staticfiles config not required for build)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          {
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "IMAGE_URI=$FULL_IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=$FULL_IMAGE"
          echo "LATEST_IMAGE=$ECR_REPOSITORY_URI:latest"

      - name: Authenticate AWS CLI and Docker login to ECR
        run: |
          set -euo pipefail
          aws --version
          aws sts get-caller-identity
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image (context ., Django app on gunicorn port 8000)
        run: |
          set -euo pipefail
          docker build -t "${ECR_REPOSITORY_URI}:${GITHUB_SHA}" -t "${ECR_REPOSITORY_URI}:latest" .
          docker image inspect "${ECR_REPOSITORY_URI}:${GITHUB_SHA}" --format 'Image {{.Id}} size {{.Size}}'

      - name: Container smoke test (gunicorn my_site.wsgi on port 8000)
        run: |
          set -euo pipefail
          docker run -d --name smoke \
            -e BLOG_SECRET_KEY=smoke-secret \
            -e DATABASE_URL=sqlite:///tmp-smoke.db \
            -e DEBUG=False \
            -e ALLOWED_HOSTS=* \
            -p 8000:8000 \
            "${ECR_REPOSITORY_URI}:${GITHUB_SHA}"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ || true)
            if [ "$CODE" = "200" ]; then echo "Smoke test passed with HTTP $CODE"; break; fi
            sleep 2
            if [ "$i" = "30" ]; then docker logs smoke; exit 1; fi
          done
          docker logs smoke
          docker rm -f smoke

      - name: Push Docker image to ECR
        run: |
          set -euo pipefail
          docker push "${ECR_REPOSITORY_URI}:${GITHUB_SHA}"
          docker push "${ECR_REPOSITORY_URI}:latest"

  deploy:
    name: Deploy to EC2 via SSM (EC2_DOCKER)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify AWS CLI identity
        run: |
          set -euo pipefail
          aws --version
          aws sts get-caller-identity

      - name: Write SSM command payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -euo pipefail",
              "export AWS_REGION=ap-south-1",
              "ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/blog-django:${IMAGE_TAG}",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "SECRET_PAYLOAD=$(aws secretsmanager get-secret-value --secret-id deptic/blog-django/secrets --region ap-south-1 --query SecretString --output text)",
              "BLOG_SECRET_KEY=$(echo $SECRET_PAYLOAD | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"BLOG_SECRET_KEY\", d.get(\"SECRET_KEY\", \"\")))' 2>/dev/null || echo '')",
              "DATABASE_URL=$(echo $SECRET_PAYLOAD | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"DATABASE_URL\", \"sqlite:///app.db\"))' 2>/dev/null || echo 'sqlite:///app.db')",
              "docker run -d --restart always --name app -p 80:8000 -e BLOG_SECRET_KEY=$BLOG_SECRET_KEY -e DATABASE_URL=$DATABASE_URL -e DEBUG=False -e ALLOWED_HOSTS=* $IMAGE_URI",
              "docker ps --filter name=app --no-trunc"
            ]
          }
          SSMPARAMS
          python3 - << 'PYEOF'
          import json, os
          path = "/tmp/ssm-params.json"
          with open(path) as f:
              data = json.load(f)
          tag = os.environ["IMAGE_TAG"]
          data["commands"] = [c.replace("${IMAGE_TAG}", tag) for c in data["commands"]]
          with open(path, "w") as f:
              json.dump(data, f, indent=2)
          print("SSM payload rendered for image tag", tag)
          PYEOF
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}

      - name: Send SSM command to EC2 instance
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Status" --output text)
          echo "SSM command status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "StandardErrorContent" --output text
            exit 1
          fi

  verify:
    name: Verify public deployment (HTTP 200)
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check public URL until HTTP 200
        run: |
          set -euo pipefail
          echo "Verifying $PUBLIC_URL (container port $CONTAINER_PORT via host port 80)"
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Deployment verified: HTTP 200 from $PUBLIC_URL/"
              exit 0
            fi
            sleep 5
          done
          echo "Deployment verification failed: never received HTTP 200"
          exit 1

      - name: Summary of deployment targets
        run: |
          set -euo pipefail
          echo "target_service=EC2_DOCKER"
          echo "region=$AWS_REGION"
          echo "instance_id=$EC2_INSTANCE_ID"
          echo "ecr_repo_url=$ECR_REPOSITORY_URI"
          echo "public_url=$PUBLIC_URL"
          echo "secrets_manager_id=$SECRETSMANAGER_ID"